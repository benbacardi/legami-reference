<!DOCTYPE html>
<html lang="en-us">

<head>

    <title>Legami Friends Pen Reference</title>

    <meta charset="utf-8" />
    <meta property="og:title" content="Legami Friends Pen Reference" />
    <meta name="description"
        content="A guide to the pens, colours, characters, and editions in the Legami Friends collection." />
    <meta property="og:description"
        content="A guide to the pens, colours, characters, and editions in the Legami Friends collection." />
    <meta property="og:url" content="https://legami.marmaladeofcourse.com/">
    <meta property="og:image" content="https://legami.marmaladeofcourse.com/img/preview.png" />
    <meta name="theme-color" content="#f1638e" />
    <meta name="fediverse:creator" content="@benbacardi@snailedit.social" />
    <link rel="icon" type="image/png" href="/img/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Ben Cardy">

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="fa/css/all.min.css">
    <link rel="stylesheet" href="css/simple-lightbox.min.css">
    <link rel="stylesheet" href="css/style.css?v=6">

    <script src="js/legami.js?v=7"></script>
    <script src="js/simple-lightbox.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ryangjchandler/alpine-tooltip@1.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/alpinejs" defer></script>

    <link rel="stylesheet" href="https://unpkg.com/tippy.js@6/dist/tippy.css" />

</head>


<body>

    <div class="content" x-data="penData">

        <h1>Legami Friends <span>Reference</span></h1>

        <p class="subhead">A guide to the pens, colours, characters, and editions in the Legami Friends collection.</p>

        <div class="filters">

            <div class="filter-header">
                <button @click="showFilters = !showFilters" class="filter-button toggle-filters"
                    title="Toggle filters"><span x-text="showFilters ? 'Hide' : 'Show'"> </span> Filters</button>
            </div>

            <div x-show="showFilters" x-transition.scale.origin.top class="types">
                <label>Browse by type</label>
                <template x-for="type in types">
                    <button @click="params.type == type.code ? params.type = 'all' : params.type = type.code"
                        class="type" :class="{'active': params.type === type.code}" :title="type.name"
                        :style="'--local-color: ' + type.color" x-text="type.name"></button>
                </template>
            </div>

            <div x-show="showFilters" x-transition.scale.origin.top class="colors">
                <label>Browse by ink</label>
                <!--<button @click="params.color = 'all'" class="color" title="All"
                    style="background-image: conic-gradient(red, yellow, lime, aqua, blue, magenta, red);"">&nbsp;</button>-->
                <template x-for=" color in colors">
                    <button @click="params.color == color.name ? params.color = 'all' : params.color = color.name"
                        class="color"
                        :class="{'active': params.color.toLowerCase() === color.name.toLowerCase(), 'metallic': color.metallic}"
                        :style="'background-color: ' + color.color" :title="color.name"
                        x-tooltip="color.name">&nbsp;</button>
                </template>
            </div>

            <div x-show="showFilters" x-transition.scale.origin.top class="types">
                <label>Browse by event</label>
                <template x-for="event in events">
                    <button @click="params.event == event.name ? params.event = 'all' : params.event = event.name"
                        class="type" :class="{'active': params.event === event.name}" :title="event.name"
                        x-text="event.name" style="--local-color: var(--orange)"></button>
                </template>
            </div>

            <div x-show="showFilters" x-transition.scale.origin.top class="types">
                <label>Browse by pack</label>
                <button @click="params.pack == 'individual' ? params.pack = 'all' : params.pack = 'individual'"
                    class="type" :class="{'active': params.pack === 'individual'}" :title="'Individual'"
                    style="--local-color: var(--orange)">Individual</button>
                <button @click="params.pack == 'multi' ? params.pack = 'all' : params.pack = 'multi'" class="type"
                    :class="{'active': params.pack === 'multi'}" :title="'Multipack'"
                    style="--local-color: var(--orange)">Multipack</button>
            </div>

            <div x-show="showFilters" x-transition.scale.origin.top class="characters">
                <label>Browse by character</label>
                <template x-for="group in characterGroups">
                    <button
                        @click="params.character == group.name ? params.character = 'all' : params.character = group.name"
                        class="character" :class="{'active': params.character === group.name}" :title="group.name"
                        :style="'background-image: url(img/' + group.characters[0].image + ')'"
                        x-tooltip="group.name"></button>
                </template>
            </div>

        </div>

        <div class="penHeader">
            <h2><span x-text="filteredPens.length"></span> Pen<span x-show="filteredPens.length !== 1">s</span></h2>
            <div class="chosen-filters">
                <span x-show="params.character !== 'all'">
                    <template x-for="group in characterGroups">
                        <span x-show="params.character == group.name" class="types">
                            <button class="character active"
                                :style="'background-image: url(img/' + group.characters[0].image + ')'"
                                :title="group.name" x-tooltip="group.name">&nbsp;</button>
                        </span>
                    </template>
                </span>
                <span x-show="params.color !== 'all'">
                    <template x-for="color in colors">
                        <span x-show="params.color.toLowerCase() == color.name.toLowerCase()">
                            <button class="color active" :class="{'metallic': color.metallic}"
                                :style="'background-color: ' + color.color" :title="color.name"
                                x-tooltip="color.name">&nbsp;</button>
                        </span>
                    </template>
                </span>
                <span x-show="params.type !== 'all'">
                    <template x-for="type in types">
                        <span x-show="params.type == type.code" class="types">
                            <span class="type active" :style="'--local-color: ' + type.color" :title="type.name"
                                x-text="type.name"></span>
                        </span>
                    </template>
                </span>
                <span x-show="params.event !== 'all'">
                    <template x-for="event in events">
                        <span x-show="params.event == event.name" class="types">
                            <span class="type active" :title="event.name" x-text="event.name" x-tooltip="event.name"
                                style="--local-color: var(--orange)"></span>
                        </span>
                    </template>
                </span>
                <span x-show="params.pack !== 'all'" class="types">
                    <span x-show="params.pack == 'individual'" class="type active" title="Individual"
                        style="--local-color: var(--orange)">Individual</span>
                    <span x-show="params.pack == 'multi'" class="type active" title="Multipack"
                        style="--local-color: var(--orange)">Multipack</span>
                </span>
            </div>
            <button @click="showImages = !showImages" class="filter-button show-images" title="Toggle pen images"><span
                    x-text="showImages ? 'Hide' : 'Show'"> </span> Large
                Images</button>
            <button @click="resetFilters" class="filter-button reset-filters" title="Reset filters">Reset
                Filters</button>
        </div>

        <div id="penGrid">

            <template x-if="filteredPens.length === 0">
                <p class="no-results">No pens match those filters.</p>
            </template>

            <template x-for="pen in filteredPens" :key="pen.id">
                <div class="card" :class="{'discontinued': !penIsAvailable(pen), 'showingImages': showImages}"
                    :data-id="pen.id" @click="toggleCollection(pen.id)">
                    <div class="card-ribbon" x-show="!penIsAvailable(pen)">Discontinued</div>
                    <div class="card-content">
                        <div class="card-header">
                            <div>
                                <strong class="name" x-text="pen.character.name"></strong>
                                <div class="statement">
                                    <template x-if="pen.notes">
                                        <i class="fas fa-info-circle" x-tooltip="pen.notes"></i>
                                    </template>
                                    <span x-text="pen.character.statement"></span>
                                </div>
                            </div>
                            <template x-if="pen.character.image">
                                <img :src="'img/' + pen.character.image" :alt="pen.character.name"
                                    class="character-image" x-show="!showImages" x-transition>
                            </template>
                        </div>

                        <input type="checkbox" :id="'collection-' + pen.id" :value="pen.id" x-model="collection"
                            class="owned-checkbox" />
                        <i class="fas fa-fw fa-check owned-indicator"></i>

                        <div class="bottom">

                            <div class="notes">

                                <template x-if="pen.multipack">
                                    <p class="note"
                                        :class="{'discontinued': pen.multipack.discontinued && penIsAvailable(pen)}">
                                        <i class="fas fa-fw fa-border-all"
                                            x-tooltip="'Multipack' + (pen.multipack.discontinued && penIsAvailable(pen) ? ' (Discontinued)' : '')"></i>
                                        <span x-text="pen.multipack.name"></span>
                                    </p>
                                </template>

                                <template x-if="penAvailableYears(pen)">
                                    <p class="note">
                                        <i class="far fa-fw fa-calendar" x-tooltip="'Year'"></i>
                                        <span x-text="penAvailableYears(pen)"></span>
                                    </p>
                                </template>

                                <template x-if="pen.multipack && pen.multipack.event">
                                    <p class="note">
                                        <i class="fas fa-fw fa-champagne-glasses" x-tooltip="'Event'"></i>
                                        <span x-text="pen.multipack.event.name"></span>
                                    </p>
                                </template>

                                <template x-if="pen.event">
                                    <p class="note">
                                        <i class="fas fa-fw fa-champagne-glasses" x-tooltip="'Event'"></i>
                                        <span x-text="pen.event.name"></span>
                                    </p>
                                </template>

                            </div>

                            <template x-if="pen.image">
                                <a :href="'img/big/' + pen.image" class="pen-image-link" @click.stop>
                                    <img :src="'img/big/thumb/' + pen.image" :alt="pen.character.name + ' pen'"
                                        class="pen-image" x-show="showImages" x-transition>
                                </a>
                            </template>

                            <template x-if="pen.color">
                                <svg class="ink" :style="'color: ' + pen.color.color" :title="pen.color.name"
                                    x-tooltip="pen.color.name">
                                    <use href="#ink"></use>
                                </svg>
                            </template>
                        </div>
                    </div>
                    <div :class="'type type-' + pen.type.code" x-text="pen.type.name"></div>
                </div>
            </template>
        </div>

        <footer>
            <p>Created by <a href="https://marmaladeofcourse.com">Ben Cardy</a>, inspired by <a
                    href="https://rknight.me">Robb Knight</a>'s <a href="https://mildliners.rknight.me/">Mildliner
                    reference</a>.</a></p>
            <p>Read the <a href="https://marmaladeofcourse.com/2026/05/14/legami-friends-reference/">blog post</a>.</p>
        </footer>

    </div>

    <script>

        const CURRENT_YEAR = new Date().getFullYear();

        document.addEventListener('alpine:init', () => {
            Alpine.data('penData', () => ({

                params: {
                    'color': 'all',
                    'type': 'all',
                    'character': 'all',
                    'event': 'all',
                    'pack': 'all',
                },

                showFilters: JSON.parse(localStorage.getItem('showFilters') || 'true'),
                showImages: JSON.parse(localStorage.getItem('showImages') || 'true'),

                pens: pens,
                colors: colors,
                types: types,
                characters: characters,
                characterGroups: characterGroups,
                events: events,
                collection: JSON.parse(localStorage.getItem('owned') || '[]'),

                penIsAvailable(pen) {
                    if (pen.individual || !pen.multipack) {
                        if (pen.discontinued) {
                            return false
                        }
                        if (pen.event && pen.year && pen.year != CURRENT_YEAR) {
                            return false;
                        }
                    } else {
                        if (pen.multipack && pen.multipack.discontinued) {
                            return false;
                        }
                        if (pen.multipack && pen.multipack.event && pen.multipack.year != CURRENT_YEAR) {
                            return false;
                        }
                    }
                    return true;
                },

                penAvailableYears(pen) {
                    var result = ""

                    if (pen.individual || !pen.multipack) {
                        if (pen.year || (pen.multipack && pen.multipack.year)) {
                            result = pen.year ? pen.year : pen.multipack.year
                        }
                        if (pen.discontinued) {
                            result += "–" + pen.discontinued;
                        }
                    } else {
                        if (pen.multipack && pen.multipack.year) {
                            result = pen.multipack.year;
                            if (pen.multipack.discontinued) {
                                result += "–" + pen.multipack.discontinued;
                            }
                        }
                    }

                    return result

                    if (pen.individual || !pen.multipack) {
                        if (pen.year) {
                            result += pen.year;
                        }
                        if (pen.discontinued) {
                            result += "–" + pen.discontinued;
                        }
                    } else if (pen.multipack && pen.multipack.year) {
                        result += pen.multipack.year;
                        if (pen.multipack.discontinued) {
                            result += "–" + pen.multipack.discontinued;
                        }
                    }
                    return result;
                },

                toggleCollection(id) {
                    console.log("Toggling collection for pen " + id);
                    this.collection.includes(id)
                        ? this.collection = this.collection.filter(item => item !== id)
                        : this.collection.push(id);
                    console.log(this.collection);
                },

                init() {
                    const urlParams = new URLSearchParams(window.location.search);
                    for (const key in this.params) {
                        if (urlParams.has(key)) {
                            this.params[key] = urlParams.get(key);
                        }
                    }
                    this.$watch('params', () => this.updateUrl(), { deep: true });
                    this.$watch('collection', (value) => {
                        localStorage.setItem('owned', JSON.stringify(value));
                    }, { deep: true });
                    this.$watch('showFilters', (value) => {
                        localStorage.setItem('showFilters', JSON.stringify(value));
                    });
                    this.$watch('showImages', (value) => {
                        localStorage.setItem('showImages', JSON.stringify(value));
                    });
                },

                updateUrl() {
                    const url = new URL(window.location.href);
                    for (const [key, value] of Object.entries(this.params)) {
                        if (value != 'all') {
                            url.searchParams.set(key, value);
                        } else {
                            url.searchParams.delete(key);
                        }
                    }
                    window.history.replaceState({}, '', url);
                },

                getCharacterGroup(name) {
                    return Object.values(this.characterGroups).filter(group => group.name === name)[0];
                },

                resetFilters() {
                    this.params = {
                        'color': 'all',
                        'type': 'all',
                        'character': 'all',
                        'event': 'all',
                        'pack': 'all',
                    }
                    window.history.replaceState({}, '', window.location.pathname);
                },

                get filteredPens() {
                    var pens = this.pens;
                    if (this.params.color !== 'all') {
                        pens = pens.filter(pen => pen.color).filter(pen => pen.color.name.toLowerCase() === this.params.color.toLowerCase())
                    }
                    if (this.params.type !== 'all') {
                        pens = pens.filter(pen => pen.type.code === this.params.type)
                    }
                    if (this.params.character !== 'all') {
                        const group = this.getCharacterGroup(this.params.character);
                        pens = pens.filter(pen => pen.character).filter(pen => group.characters.includes(pen.character))
                    }
                    if (this.params.event !== 'all') {
                        pens = pens.filter(pen => {
                            if (pen.event && pen.event.name === this.params.event) {
                                return pen;
                            }
                            if (pen.multipack && pen.multipack.event && pen.multipack.event.name === this.params.event) {
                                return pen;
                            }
                        });
                    }
                    if (this.params.pack !== 'all') {
                        pens = pens.filter(pen => {
                            if (this.params.pack === 'individual' && (!pen.multipack || pen.individual)) {
                                return pen;
                            }
                            if (this.params.pack === 'multi' && pen.multipack) {
                                return pen;
                            }
                            if (pen.multipack && this.params.pack === pen.multipack.name) {
                                return pen;
                            }
                        });
                    }
                    return pens
                }

            }))
        })

        document.addEventListener('alpine:initialized', () => {
            var lightbox = new SimpleLightbox(".pen-image-link", { captions: false, nav: false, showCounter: false })
        })

    </script>
